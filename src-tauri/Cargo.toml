[package]
name = "ai-usage-hub"
version = "0.1.24"
description = "Local-first AI subscription and application usage dashboard"
authors = ["AI Usage Hub contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "ai_usage_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
