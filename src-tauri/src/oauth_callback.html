<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · AI Usage Hub</title>
<style>
  :root { --pink: #f0abc5; --rose: #dba8c2; --blush: #ffe6ef; --muted: #c9b6c3; --line: rgba(236, 145, 175, .42); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden; padding: 16px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--blush);
    background:
      radial-gradient(circle at 78% -10%, rgba(240, 171, 197, .26), transparent 45%),
      radial-gradient(circle at 12% 110%, rgba(219, 120, 165, .2), transparent 48%),
      radial-gradient(circle at 50% 50%, rgba(240, 171, 197, .08), transparent 40%),
      linear-gradient(145deg, #251c32, #191523 62%, #17131e);
  }
  /* Far-away dust: tiny dots painted by gradients, no images. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .8;
    background-image:
      radial-gradient(1.2px 1.2px at 8% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 23% 71%, #f6cfe0 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 37% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 52% 88%, #f6cfe0 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 66% 35%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 79% 64%, #f6cfe0 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 91% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 14% 92%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 94%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 96% 79%, #f6cfe0 50%, transparent 51%);
  }
  .star { position: fixed; color: var(--pink); line-height: 1; pointer-events: none; text-shadow: 0 0 14px rgba(240, 171, 197, .65); animation: twinkle 4.8s ease-in-out infinite; }
  .s1 { top: 11%; left: 13%; font-size: 26px; }
  .s2 { top: 19%; right: 16%; font-size: 15px; animation-delay: -1.2s; }
  .s3 { bottom: 17%; left: 21%; font-size: 13px; animation-delay: -2.6s; }
  .s4 { bottom: 12%; right: 11%; font-size: 30px; animation-delay: -3.4s; }
  .s5 { top: 46%; left: 6%; font-size: 11px; animation-delay: -.6s; }
  .s6 { top: 58%; right: 7%; font-size: 12px; animation-delay: -2s; }
  .s7 { top: 7%; left: 47%; font-size: 12px; animation-delay: -4s; }
  .s8 { top: 31%; left: 27%; font-size: 9px; animation-delay: -1.8s; }
  .s9 { top: 34%; right: 26%; font-size: 18px; animation-delay: -3s; }
  .s10 { bottom: 29%; right: 23%; font-size: 10px; animation-delay: -.9s; }
  .s11 { bottom: 7%; left: 44%; font-size: 16px; animation-delay: -2.2s; }
  .s12 { bottom: 38%; left: 15%; font-size: 17px; animation-delay: -4.2s; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  .card {
    position: relative; width: min(420px, 100%); padding: 38px 32px 32px; text-align: center;
    border: 1px solid var(--line); border-radius: 22px;
    background: linear-gradient(160deg, rgba(48, 26, 44, .92), rgba(27, 18, 30, .94));
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
    animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .badge {
    display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 18px;
    border: 1px solid rgba(240, 171, 197, .45); border-radius: 50%;
    background: radial-gradient(circle, rgba(240, 171, 197, .28), rgba(240, 171, 197, .06) 70%);
    color: var(--pink); font-size: 30px; text-shadow: 0 0 18px rgba(240, 171, 197, .9);
  }
  .eyebrow { margin: 0 0 8px; color: #9c8998; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: -.02em; color: #fff; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .hint { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(236, 145, 175, .16); color: #9c8998; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .star, .card { animation: none; } }
</style>
</head>
<body>
  <span class="star s1" aria-hidden="true">✦</span>
  <span class="star s2" aria-hidden="true">✦</span>
  <span class="star s3" aria-hidden="true">✦</span>
  <span class="star s4" aria-hidden="true">✦</span>
  <span class="star s5" aria-hidden="true">✦</span>
  <span class="star s6" aria-hidden="true">✦</span>
  <span class="star s7" aria-hidden="true">✦</span>
  <span class="star s8" aria-hidden="true">✦</span>
  <span class="star s9" aria-hidden="true">✦</span>
  <span class="star s10" aria-hidden="true">✦</span>
  <span class="star s11" aria-hidden="true">✦</span>
  <span class="star s12" aria-hidden="true">✦</span>
  <main class="card">
    <div class="badge" aria-hidden="true">{{ICON}}</div>
    <p class="eyebrow">AI Usage Hub</p>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
    <p class="hint">{{HINT}}</p>
  </main>
  {{SCRIPT}}
</body>
</html>
