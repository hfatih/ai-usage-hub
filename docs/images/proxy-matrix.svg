    <text x="604" y="110" fill="#64748b" font-family="monospace" font-size="10"># Run aider with proxy</text>
    <text x="604" y="130" fill="#818cf8" font-family="monospace" font-size="10">aider --openai-api-base \</text>
    <text x="604" y="148" fill="#38bdf8" font-family="monospace" font-size="10">  http://127.0.0.1:8046/v1 \</text>
    <text x="604" y="166" fill="#10b981" font-family="monospace" font-size="10">  --model gemini-2.5-pro</text>

    <rect x="594" y="200" width="244" height="36" rx="6" fill="#1e293b"/>
    <text x="716" y="222" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Silent Background Downgrade</text>
