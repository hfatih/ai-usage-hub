  <text x="540" y="87" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Settings</text>
  <rect x="730" y="70" width="130" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
  <circle cx="745" cy="83" r="3.5" fill="#06b6d4"/>
  <text x="795" y="87" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Proxy: 127.0.0.1:8046</text>

