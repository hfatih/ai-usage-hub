    <rect width="852" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">FEATURES:</text>
    <text x="90" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Port 8046 Local Relay</text>
    <text x="260" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Multi-Account 429 Failover</text>
    <text x="470" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Claude 3.7 Thinking Budget</text>
    <text x="700" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 100% Offline / Local Only</text>
