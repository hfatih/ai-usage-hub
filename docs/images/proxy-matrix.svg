      <stop stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
