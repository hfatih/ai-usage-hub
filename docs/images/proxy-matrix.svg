    <text x="24" y="110" fill="#64748b" font-family="monospace" font-size="10"># In powershell profile</text>
    <text x="24" y="128" fill="#f59e0b" font-family="monospace" font-size="10">$env:ANTHROPIC_BASE_URL=</text>
    <text x="24" y="144" fill="#38bdf8" font-family="monospace" font-size="10">"http://127.0.0.1:8046"</text>
    <text x="24" y="162" fill="#10b981" font-family="monospace" font-size="10">claude</text>

    <rect x="14" y="200" width="244" height="36" rx="6" fill="#1e293b"/>
    <text x="136" y="222" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Thinking Budget: Supported</text>

