    <text x="314" y="128" fill="#38bdf8" font-family="monospace" font-size="10">http://127.0.0.1:8046/v1</text>
    <text x="314" y="148" fill="#64748b" font-family="monospace" font-size="10">Model: gemini-2.5-pro</text>
    <text x="314" y="166" fill="#10b981" font-family="monospace" font-size="10">API Key: hub-local-proxy</text>

    <rect x="304" y="200" width="244" height="36" rx="6" fill="#1e293b"/>
    <text x="426" y="222" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Full Streaming SSE Support</text>

    <!-- Card 3: Cline & Aider -->
    <rect x="580" y="0" width="272" height="250" rx="10" fill="url(#cardGrad)" stroke="#1e293b"/>
    <rect x="594" y="14" width="110" height="20" rx="4" fill="#818cf8" fill-opacity="0.15"/>
    <text x="649" y="28" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CLINE / AIDER</text>
    <text x="594" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Autonomous Coding</text>
    <text x="594" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Auto Fallback on 429 Error</text>

    <!-- Code Block -->
