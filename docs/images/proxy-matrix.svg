  <text x="450" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Usage Hub — Local AI API Proxy Gateway &amp; Client Matrix</text>

  <!-- Navigation Bar -->
