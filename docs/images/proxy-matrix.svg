  <text x="45" y="88" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AI Usage Hub</text>
  <text x="200" y="87" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Dashboard</text>
  <text x="290" y="87" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Accounts</text>
